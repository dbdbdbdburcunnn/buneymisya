<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Defterim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a href="#" class="brand">Defterim</a>
    <nav class="jump" aria-label="Bölümler">
      <a href="#accounts">Hesaplar</a>
      <a href="#recipes">Tarifler</a>
      <a href="#notes">Notlar</a>
      <a href="#plans">Planlar</a>
      <a href="#films">Film ve dizi</a>
      <a href="#goals">Hedefler</a>
    </nav>
    <input type="search" id="search" placeholder="Her yerde ara" aria-label="Her yerde ara">
  </div>
</header>

<main class="page">
  <section id="accounts" class="block">
    <div class="block-head">
      <h2>Hesaplar <span class="count" id="c-accounts"></span></h2>
      <button class="btn primary" data-add="accounts" type="button">Hesap ekle</button>
    </div>
    <div class="grid" id="list-accounts"></div>
  </section>

  <section id="recipes" class="block">
    <div class="block-head">
      <h2>Tarifler <span class="count" id="c-recipes"></span></h2>
      <button class="btn primary" data-add="recipes" type="button">Tarif ekle</button>
    </div>
    <div class="stack" id="list-recipes"></div>
  </section>

  <section id="notes" class="block">
    <div class="block-head">
      <h2>Notlar <span class="count" id="c-notes"></span></h2>
      <button class="btn primary" data-add="notes" type="button">Not ekle</button>
    </div>
    <div class="grid" id="list-notes"></div>
  </section>

  <section id="plans" class="block">
    <div class="block-head">
      <h2>Planlar <span class="count" id="c-plans"></span></h2>
      <button class="btn primary" data-add="plans" type="button">Plan ekle</button>
    </div>
    <div class="stack" id="list-plans"></div>
  </section>

  <section id="films" class="block">
    <div class="block-head">
      <h2>Film ve dizi <span class="count" id="c-films"></span></h2>
      <button class="btn primary" data-add="films" type="button">Öneri ekle</button>
    </div>
    <div class="filters" id="filmFilters" role="group" aria-label="Filtre">
      <button type="button" class="chip" data-filter="all">Hepsi</button>
      <button type="button" class="chip" data-filter="todo">İzlenecekler</button>
      <button type="button" class="chip" data-filter="done">İzlediklerimiz</button>
    </div>
    <div class="grid" id="list-films"></div>
  </section>

  <section id="goals" class="block">
    <div class="block-head">
      <h2>Hedefler <span class="count" id="c-goals"></span></h2>
      <button class="btn primary" data-add="goals" type="button">Hedef ekle</button>
    </div>
    <div class="game" id="game"></div>
    <div class="grid" id="list-goals"></div>
  </section>

  <footer class="foot">
    <p>Kayıtlar yalnızca bu tarayıcıda saklanır. Başka bir cihaza taşımak için yedek al.</p>
    <div class="foot-actions">
      <button id="exportBtn" class="btn" type="button">Yedek indir</button>
      <button id="importBtn" class="btn" type="button">Yedek yükle</button>
    </div>
  </footer>
</main>

<dialog id="editor">
  <form id="editorForm">
    <h3 id="editorTitle"></h3>
    <div id="fields"></div>
    <div class="dialog-actions">
      <button type="button" id="deleteBtn" class="btn danger">Sil</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn">Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<input type="file" id="fileInput" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
