<!DOCTYPE html>
<html lang="tr" data-theme="burcun">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B1720">
<title>Defterim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-ek.css">
</head>
<body>

<div class="login" id="login">
  <div class="login-box">
    <div class="login-heart" aria-hidden="true">♡</div>
    <h1>Kim giriyor?</h1>
    <div class="login-btns" id="loginPick">
      <button type="button" class="login-btn burcun" data-profile="burcun">Burcun</button>
      <button type="button" class="login-btn dodom" data-profile="dodom">Dodom</button>
    </div>
    <form class="login-form" id="loginForm" autocomplete="off" hidden>
      <p class="login-who"><span id="loginWho"></span> için şifreni yaz</p>
      <input type="password" id="loginPw" class="login-pw" aria-label="Şifre" autocomplete="current-password">
      <p class="login-err" id="loginErr" role="alert"></p>
      <div class="login-btns">
        <button type="button" class="login-btn small" id="loginBack">Geri</button>
        <button type="submit" class="login-btn small go" id="loginGo">Giriş</button>
      </div>
    </form>
  </div>
</div>

<div class="shell">
  <aside class="side" id="side" aria-label="Menü">
    <div class="brand"><span class="heart" aria-hidden="true">♡</span></div>
    <nav class="nav" id="nav" aria-label="Bölümler"></nav>
    <p class="side-quote">Daha iyi bir sen,<br>her gün mümkün. <span class="heart" aria-hidden="true">♡</span></p>
    <button type="button" class="side-switch" id="switchBtn">Hesap değiştir</button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="panel">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Menüyü aç">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <label class="gsearch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input type="search" id="gsearch" placeholder="Aradığın her şey burada…" aria-label="Her yerde ara" autocomplete="off">
      </label>
      <div class="clock"><span id="today"></span><span id="time"></span></div>
    </header>

    <section class="view" data-sec="home" id="home"></section>

    <section class="view" data-sec="search" id="searchView" hidden>
      <header class="view-head">
        <div class="view-title">
          <div><h2>Arama sonuçları</h2><p class="view-sub" id="searchSub"></p></div>
        </div>
      </header>
      <div class="stack" id="searchList"></div>
    </section>

    <div id="views"></div>
  </main>
</div>

<dialog id="editor">
  <form id="editorForm">
    <h3 id="editorTitle"></h3>
    <div id="fields"></div>
    <div class="dialog-actions">
      <button type="button" id="deleteBtn" class="btn danger">Sil</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn">Vazgeç</button>
      <button type="submit" class="btn primary">Kaydet</button>
    </div>
  </form>
</dialog>

<dialog id="confirmBox" class="confirm">
  <form method="dialog">
    <div class="confirm-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg>
    </div>
    <h3>Bunu silelim mi?</h3>
    <p class="confirm-name" id="confirmName"></p>
    <p class="confirm-text">Silinen kayıt geri getirilemez.</p>
    <div class="confirm-actions">
      <button type="submit" value="no" class="btn" autofocus>Vazgeç</button>
      <button type="submit" value="yes" class="btn danger-solid">Evet, sil</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
